<style>
:root{--noite:#0D2B4E;--tejo:#17457F;--ambar:#D39A5A;--ambar-claro:#E9C59C;--ardosia:#8FA9CC;--nevoa:#EEF2F6;--papel:#F7F9FB;--tinta:#14202F;--suave:#4C5A6E;--linha:#D3DCE7;--angulo:-22.8deg;--f:"Archivo","Helvetica Neue",Arial,sans-serif;--ease:cubic-bezier(.22,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--f);font-stretch:100%;color:#fff;background:var(--noite);-webkit-font-smoothing:antialiased;overflow-x:hidden}
:focus-visible{outline:3px solid var(--ambar);outline-offset:3px}
.porta{position:relative;isolation:isolate;overflow:hidden;min-height:100svh;display:flex;flex-direction:column}
.porta>img,.porta>video{position:absolute;inset:0;z-index:-3;width:100%;height:100%;object-fit:cover;object-position:center 60%}
.porta::before{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(160deg,rgba(10,35,64,.88),rgba(10,35,64,.6) 60%,rgba(10,35,64,.8))}
.rumo{position:absolute;inset:0;z-index:-1;pointer-events:none}
.rumo i{position:absolute;left:40%;width:90%;height:clamp(1.3rem,2.6vw,2.3rem);transform-origin:left center;transform:rotate(var(--angulo))}
.rumo i:first-child{bottom:22%;background:var(--ambar)}
.rumo i:last-child{bottom:calc(22% - clamp(1.9rem,3.7vw,3.3rem));background:var(--ardosia)}
.topo{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.2rem clamp(1.25rem,5vw,3rem)}
.topo svg{height:clamp(2.3rem,4vw,2.9rem);width:auto;display:block}
.estado{display:flex;align-items:center;gap:.6rem;padding:.55rem 1.05rem .55rem .85rem;border-radius:3rem;background:rgba(255,255,255,.12);font:600 .92rem var(--f);white-space:nowrap}
.estado i{width:.6rem;height:.6rem;border-radius:50%;background:var(--ambar);box-shadow:0 0 0 .3rem rgba(211,154,90,.28)}
.centro{flex:1;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:1.5rem clamp(1rem,4vw,2rem) 8rem}
.entrar{position:relative;width:min(100%,27rem);background:#fff;color:var(--tinta);border-radius:1.25rem;padding:2.2rem 2.1rem 1.75rem;box-shadow:0 40px 80px -30px rgba(0,0,0,.7)}
.entrar::before{content:"";position:absolute;left:2.1rem;right:2.1rem;top:0;height:5px;border-radius:0 0 5px 5px;background:var(--ambar)}
.cab{display:flex;align-items:center;gap:.9rem;margin-bottom:1.5rem}
.cadeado{width:3.25rem;height:3.25rem;flex:none;border-radius:.9rem;background:var(--ambar);color:var(--noite);display:grid;place-items:center}
.cadeado svg{width:1.6rem;height:1.6rem}
.cab h1{font:800 2.8rem/.88 var(--f);font-stretch:62%;text-transform:uppercase;color:var(--noite)}
.cab p{margin-top:.3rem;font-size:.95rem;color:var(--suave)}
.campo{margin-bottom:1rem}
.campo label{display:block;margin-bottom:.5rem;font:700 .95rem var(--f);color:var(--noite)}
.caixa{display:flex;align-items:center;gap:.75rem;height:3.5rem;padding:0 .5rem 0 1rem;border-radius:.75rem;border:2px solid var(--linha);background:var(--papel);transition:border-color .2s,box-shadow .2s,background .2s}
.caixa:focus-within{border-color:var(--tejo);background:#fff;box-shadow:0 0 0 5px rgba(23,69,127,.12)}
.caixa>svg{width:1.25rem;height:1.25rem;color:var(--suave);flex:none}
.caixa input{flex:1;min-width:0;height:100%;border:0;background:none;font:500 1.15rem var(--f);color:var(--tinta);outline:none}
.olho{display:flex;align-items:center;gap:.35rem;height:2.5rem;padding:0 .6rem;border:0;border-radius:.5rem;background:none;cursor:pointer;font:700 .88rem var(--f);color:var(--tejo)}
.olho:hover{background:var(--nevoa)}
.olho svg{width:1.1rem;height:1.1rem}
.lembrar{display:flex;align-items:center;gap:.6rem;width:max-content;margin:.4rem 0 1.4rem;font-size:.95rem;color:var(--suave);cursor:pointer}
.lembrar input{width:1.35rem;height:1.35rem;accent-color:var(--noite);cursor:pointer}
.botao{display:flex;align-items:center;justify-content:center;gap:.6rem;width:100%;height:3.75rem;border:0;border-radius:.75rem;background:var(--ambar);color:var(--noite);font:800 1.3rem var(--f);cursor:pointer;transition:transform .25s var(--ease),filter .2s}
.botao:hover{filter:brightness(1.06);transform:translateY(-2px)}
.botao svg{width:1.4rem;height:1.4rem}
.botao[disabled]{opacity:.7;cursor:progress;transform:none}
.erro{display:flex;gap:.55rem;align-items:flex-start;margin:0 0 1rem;padding:.75rem .9rem;border-radius:.65rem;background:rgba(184,70,59,.09);color:#B8463B;font:600 .95rem/1.4 var(--f)}
.erro svg{width:1.2rem;height:1.2rem;flex:none;margin-top:.05rem}
.erro[hidden]{display:none}
.nota{margin-top:1rem;font-size:.9rem;line-height:1.45;color:var(--suave);text-align:center}
.nota a{color:inherit}
.fita{position:absolute;left:-4rem;right:-4rem;bottom:clamp(1.5rem,4vw,2.5rem);height:clamp(3rem,4.4vw,4rem);background:var(--ambar);transform:rotate(-2deg);display:flex;align-items:center;gap:1.75rem;white-space:nowrap;overflow:hidden;box-shadow:0 16px 28px -16px rgba(0,0,0,.6)}
.fita span{display:flex;align-items:center;gap:1.75rem;font:800 clamp(1.4rem,2.4vw,2.15rem)/1 var(--f);font-stretch:62%;text-transform:uppercase;color:var(--noite)}
.fita span::after{content:"";width:3.6rem;height:1.25rem;background:repeating-linear-gradient(var(--angulo),var(--noite) 0 9px,transparent 9px 18px)}
@media (max-width:40rem){.entrar{padding:1.8rem 1.3rem 1.4rem}.entrar::before{left:1.3rem;right:1.3rem}.estado{font-size:.82rem;padding:.45rem .8rem .45rem .7rem}.rumo{display:none}}
@media (prefers-reduced-motion:no-preference){.fita>span{animation:corre 26s linear infinite}.entrar.abana{animation:abana .45s var(--ease)}
@keyframes corre{to{transform:translateX(-100%)}}@keyframes abana{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}}
</style>
</head>
